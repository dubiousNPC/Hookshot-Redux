blending_rules:
  # Base: 0.2-0.4s.
  - from: "*"
    to: "*"
    easing: "sineOut"
    duration: 0.25

  # Bottom-most rule wins.
  - from: "*"
    to: "hookgo: *"
    easing: "sineOut"
    duration: 0.22   # clip is 0.67s
  - from: "*"
    to: "hookhang: *"
    easing: "sineOut"
    duration: 0.06   # clip is 0.17s
  - from: "*"
    to: "hookhangdwn: *"
    easing: "sineOut"
    duration: 0.11   # clip is 0.33s
  - from: "*"
    to: "hookhangup: *"
    easing: "sineOut"
    duration: 0.11   # clip is 0.33s
  - from: "*"
    to: "hookitem: *"
    easing: "sineOut"
    duration: 0.22   # clip is 0.67s
  - from: "*"
    to: "hookshoot: *"
    easing: "sineOut"
    duration: 0.17   # clip is 0.5s
